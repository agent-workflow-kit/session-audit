# The retro session's permission profile (claude-session, Permission profiles).
# It only adds denies. The allow rules claude-session generates cover Read, Edit, Write and the
# report command, and it sets the permission mode; the Skill tool under dontAsk is verified live (#37).
permissions:
  deny:
    - Agent
    - Task
    - WebFetch
    - WebSearch
    - NotebookEdit
    - "mcp__*"
    - "Bash(memoctl:*)"
    - "Bash(agent-spawn:*)"
    - "Bash(forgectl:*)"
    - "Bash(ticketctl:*)"
    - "Bash(notice-route:*)"
    - "Bash(awkit:*)"
    - "Bash(session-audit:*)"
sandbox:
  network:
    allowedDomains: []
